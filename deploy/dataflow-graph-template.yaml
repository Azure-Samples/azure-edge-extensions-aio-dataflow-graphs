apiVersion: connectivity.iotoperations.azure.com/v1
kind: DataflowGraph
metadata:
  name: graph
  namespace: azure-iot-operations
spec:
  requestDiskPersistence: Disabled
  profileRef: default

  nodes:
    - nodeType: Source
      name: temperature-source
      sourceSettings:
        endpointRef: default
        dataSources:
          - raw

    - nodeType: Graph
      name: temperature-schema-validation
      graphSettings:
        registryEndpointRef: registry-endpoint-acr
        artifact: graph-simple-schema-validation:1.0.0

    - nodeType: Graph
      name: temperature-filter
      graphSettings:
        registryEndpointRef: registry-endpoint-acr
        artifact: graph-simple-filter:1.0.0
        configuration:
        - key: temperature_lower_bound
          value: "2000"
        - key: temperature_upper_bound
          value: "4000"

    - nodeType: Destination
      name: temperature-destination
      destinationSettings:
        endpointRef: default
        dataDestination: processed

  nodeConnections:
    - from:
        name: temperature-source
        schema:
          schemaRef: aio-sr://__{schema_ref}__:1
          serializationFormat: Json
      to:
        name: temperature-schema-validation

    - from:
        name: temperature-schema-validation
      to:
        name: temperature-filter    

    - from:
        name: temperature-filter
      to:
        name: temperature-destination